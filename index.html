<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reporte de daños TMAZ R-11</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: igual que las herramientas TMAZ — barra verde con línea roja, menú lateral de pasos, contenido en tarjetas, Anterior/Siguiente */
:root{
  --bg:#f3f6f3; --card:#ffffff; --soft:#f7fbf8; --soft-2:#e9f1eb; --active:#e1efe7; --line:#d9e3dc; --line-2:#c9d6cd;
  --ink:#1b2a22; --muted:#4a6357; --muted-2:#6d8278;
  --green:#006741; --green-d:#004b2f; --green-btn:#005c3c; --red:#ee2d42; --red-ink:#c4202f; --red-soft:#fde8ea;
  --amber:#b45309; --amber-soft:#fff3e0; --on:#ffffff; --sigbg:#ffffff;
  --f-title:"Baloo 2","Nunito","Segoe UI",sans-serif;
  --f-body:"Nunito","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --card:#16211b; --soft:#1a2720; --soft-2:#1f2f26; --active:#1d3a2b; --line:#2a3b32; --line-2:#36493e;
  --ink:#e4ede7; --muted:#a3b8ac; --muted-2:#8aa094; --green:#47b882; --green-d:#00361f; --green-btn:#1f8a5b; --red:#f2475a; --red-ink:#ff7b88; --red-soft:#3a1b20;
  --amber:#f0a44b; --amber-soft:#3a2a14; --on:#ffffff; --sigbg:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --card:#16211b; --soft:#1a2720; --soft-2:#1f2f26; --active:#1d3a2b; --line:#2a3b32; --line-2:#36493e;
  --ink:#e4ede7; --muted:#a3b8ac; --muted-2:#8aa094; --green:#47b882; --green-d:#00361f; --green-btn:#1f8a5b; --red:#f2475a; --red-ink:#ff7b88; --red-soft:#3a1b20;
  --amber:#f0a44b; --amber-soft:#3a2a14; --on:#ffffff; --sigbg:#ffffff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}

/* Barra superior */
.top{background:var(--green-d);border-bottom:4px solid var(--red);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--green-d)}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{width:72px;height:48px;background:#fff;border-radius:10px;display:grid;place-items:center;flex:none}
.logo img{width:60px;height:auto}
.tt{flex:1;min-width:0}
.tt .code{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.tt h1{font-family:var(--f-title);font-weight:800;font-size:1.45rem;line-height:1.15}
.tools{display:flex;gap:8px;flex:none;align-items:center}
.lang{display:flex;border:1.5px solid rgba(255,255,255,.6);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;font-weight:800;font-size:.85rem;padding:6px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--green-d)}
.pillbtn{background:none;border:1.5px solid rgba(255,255,255,.6);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:.85rem;cursor:pointer;white-space:nowrap}

/* Estructura */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start;padding-block:22px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(92px + env(safe-area-inset-top,0px))}
.nav button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1.5px solid transparent}
.nav button:focus-visible{outline:3px solid var(--green)}
.nav .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:.85rem;color:var(--green);background:var(--soft);border:1.5px solid var(--line-2)}
.nav b{display:block;font-weight:800;font-size:.95rem;line-height:1.2}
.nav small{display:block;color:var(--muted);font-size:.78rem;line-height:1.25}
.nav button.done .n{color:var(--green);border-color:var(--green)}
.nav button[aria-current=step]{background:var(--active);border-color:var(--green)}
.nav button[aria-current=step] .n{background:var(--green);color:var(--on);border-color:var(--green)}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--f-title);font-weight:700;font-size:1.45rem;color:var(--green);line-height:1.2}
.card .sub{color:var(--muted);margin-top:-8px}
.howto summary{cursor:pointer;font-weight:800;color:var(--green);list-style:none}
.howto summary::before{content:"▸ ";} .howto[open] summary::before{content:"▾ ";}
.howto ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.howto ol b{color:var(--ink)}
.exrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;color:var(--muted);font-size:.85rem}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.grid .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lbl.req::after{content:" *";color:var(--red)}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem}
textarea{min-height:80px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
.bad{border-color:var(--red)!important;background:var(--red-soft)!important}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radio{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line-2);border-radius:999px;padding:8px 14px;font-weight:800;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;background:var(--soft)}
.radio input{accent-color:var(--green);width:16px;height:16px;margin:0}
.radio:has(input:checked){border-color:var(--green);background:var(--active);color:var(--green)}

/* Tipos de mercancía */
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.type{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--line-2);border-radius:14px;padding:16px;background:var(--soft);min-width:0}
.type:focus-visible{outline:3px solid var(--green)}
.type svg{width:48px;height:32px;color:var(--muted)}
.type b{font-family:var(--f-title);font-size:1.25rem;font-weight:700;line-height:1.1}
.type small{color:var(--muted);font-size:.82rem}
.type[aria-pressed=true]{border-color:var(--green);background:var(--active)}
.type[aria-pressed=true] svg,.type[aria-pressed=true] b{color:var(--green)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--amber-soft);border:1.5px solid var(--amber);border-radius:12px;padding:12px 14px;font-weight:600}
.banner span{flex:1 1 260px}
.instr{background:var(--green-d);color:#fff;border-radius:14px;padding:16px 18px;font-weight:700}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ex{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft);display:flex;flex-direction:column}
.ex:focus-visible{outline:3px solid var(--green)}
.ex img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.ex span{padding:8px 10px;font-weight:700;font-size:.88rem;display:flex;gap:8px;align-items:center}

/* Chips de daño */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line-2);background:var(--soft);border-radius:999px;padding:7px 14px;font-weight:800;font-size:.9rem;line-height:1.2}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.chip .cd{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.chip[aria-pressed=true] .dot{background:#fff}
.chip[aria-pressed=true] .cd{color:rgba(255,255,255,.85)}
.chip.sd{--c:#15803d}

/* Piezas */
.listhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.count{font-weight:800;color:var(--green);font-size:.92rem;font-variant-numeric:tabular-nums}
.paste summary{cursor:pointer;font-weight:800;color:var(--green)}
.paste{border:1.5px dashed var(--line-2);border-radius:12px;padding:10px 14px}
.paste[open] textarea{margin-top:10px}
.piece{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;background:var(--soft-2);padding:10px 14px}
.badge{min-width:30px;height:30px;padding:0 6px;border-radius:8px;background:var(--green);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none}
.ph .pid{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono)}
.st{font-size:.78rem;font-weight:800;border-radius:999px;padding:2px 10px;border:1.5px solid;white-space:nowrap}
.st.warn{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.st.dmg{color:var(--red-ink);border-color:var(--red);background:var(--red-soft)}
.st.ok{color:var(--green);border-color:var(--green);background:var(--active)}
.ib{background:none;border:0;cursor:pointer;color:var(--muted);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--card);color:var(--ink)}
.pb{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:20px;padding:16px}
.pl{display:flex;flex-direction:column;gap:14px;min-width:0}
.ev{border:1.5px dashed var(--line-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:stretch;align-self:start}
.ev .thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.th{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.ev .hint{color:var(--muted);font-size:.85rem;text-align:center}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 20px;font-weight:800;border:1.5px solid var(--green-btn);background:var(--card);color:var(--green)}
.btn.solid{background:var(--green-btn);color:var(--on)}
.btn.sm{padding:7px 14px;font-size:.88rem}
.btn.danger{border-color:var(--red);color:var(--red-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.navrow .sp{flex:1}
.chk{display:flex;gap:10px;align-items:center;font-weight:700}
.chk input{width:20px;height:20px;accent-color:var(--green)}

/* Firmas */
.sigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sig{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sig h3{font-family:var(--f-body);font-weight:800;color:var(--green);font-size:1rem}
.sigbox{all:unset;cursor:pointer;height:96px;border:1.5px dashed var(--line-2);border-radius:10px;background:var(--sigbg);display:grid;place-items:center;font-weight:800;color:#4a6357;overflow:hidden}
.sigbox:focus-visible{outline:3px solid var(--green)}
.sigbox img{max-height:90px;max-width:100%}

.sigs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.ts{font-size:.78rem;color:var(--muted);font-weight:700}
.party{border:1.5px solid var(--green);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--soft)}
.party h3{font-family:var(--f-title);font-weight:700;color:var(--green);font-size:1.2rem}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.decl{background:var(--green-d);color:#fff;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.decl p{margin:0;font-weight:700}
.decl .radio{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.decl .radio:has(input:checked){background:#fff;color:var(--green-d);border-color:#fff}
.decl textarea{background:#fff;color:#1b2a22;border-color:#fff}
.folio{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.folio .th{width:120px;aspect-ratio:4/3}
.folio .btns{display:flex;flex-direction:column;gap:8px}
.privacy{font-size:.8rem;color:var(--muted)}
.sigbox:disabled,.sigbox[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.sigNote{background:var(--soft-2);border-radius:10px;padding:10px 12px;font-weight:700;font-size:.92rem}
.party-sum{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.92rem}
/* Resumen */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-title);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem;font-weight:700}
.stat.r b{color:var(--red-ink)} .stat.g b{color:var(--green)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:520px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center}
.tbl th{background:var(--green-d);color:#fff;font-family:var(--f-mono);font-weight:600;font-size:.8rem}
.tbl td:nth-child(2){text-align:left;font-family:var(--f-mono)}
.tbl td.x{color:var(--red-ink);font-weight:800} .tbl td.xs{color:var(--green);font-weight:800}
.issues{background:var(--red-soft);border:1.5px solid var(--red);border-radius:12px;padding:12px 16px}
.issues ul{margin:6px 0 0;padding-left:18px}
.issues button{all:unset;cursor:pointer;text-decoration:underline;color:var(--red-ink);font-weight:700}
.okmsg{background:var(--active);border:1.5px solid var(--green);border-radius:12px;padding:12px 16px;font-weight:700;color:var(--green)}
.foot{color:var(--muted);font-size:.8rem;text-align:center;padding:0 16px 30px}

/* Ventanas */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.mbox{background:var(--card);border-radius:16px;width:100%;max-width:620px;padding:18px;display:flex;flex-direction:column;gap:12px}
.mbox h3{font-family:var(--f-title);color:var(--green);font-size:1.3rem}
.padw{position:relative;height:240px;border-radius:12px;background:#fff;border:1.5px solid var(--line-2);touch-action:none}
.padw canvas{width:100%;height:100%;display:block;border-radius:12px;cursor:crosshair}
.padw .ln{position:absolute;left:24px;right:24px;bottom:48px;border-top:2px solid #9fb0a6;pointer-events:none}
.padw .lt{position:absolute;left:24px;bottom:26px;font-size:.8rem;color:#6d8278;pointer-events:none}
.mrow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.mrow .sp{flex:1}
.mimg{width:100%;max-height:65vh;object-fit:contain;background:#000;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:70;font-weight:700;max-width:calc(100% - 32px)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .nav{position:static;flex-direction:row;overflow-x:auto;padding:6px}
  .nav button{flex:none;padding:8px 10px}
  .nav small{display:none}
  .pb{grid-template-columns:1fr}
  .ev .thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:640px){
  .grid,.sigs,.sigs.two,.types{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tt h1{font-size:1.1rem} .tt .code{font-size:.66rem}
  .logo{width:52px;height:40px} .logo img{width:44px}
  .top{position:static}
  .top .in{flex-wrap:wrap}
  .tools{width:100%;justify-content:flex-end}
  .nav b{font-size:.85rem}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>


<header class="top"><div class="in">
  <div class="logo"><img id="logo" alt="TMAZ Terminal Marítima Mazatlán"></div>
  <div class="tt"><div class="code"><span>TMAZ-SIG-OPE-R-11 · </span><span data-i="ver">Versión 00</span><span> · </span><span data-i="saved">Guardado en este navegador</span></div>
    <h1 data-i="title">Reporte de daños en mercancía</h1></div>
  <div class="tools">
    <div class="lang" role="group" aria-label="Idioma"><button type="button" id="lES" aria-pressed="true">ES</button><button type="button" id="lEN" aria-pressed="false">EN</button></div>
    <button type="button" class="pillbtn" id="themeBtn"></button>
  </div>
</div></header>

<div class="shell">
  <nav class="nav" id="nav" aria-label="Pasos"></nav>
  <main id="main"></main>
</div>
<p class="foot" data-i="foot">Copia no controlada si se imprime o descarga. Consulte la versión vigente en el repositorio oficial del SIG de TMAZ.</p>

<div class="modal" id="sigModal" hidden><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="sigTitle">
  <h3 id="sigTitle"></h3>
  <div class="sigNote" id="sigNote" hidden></div>
  <div class="padw"><canvas id="sigCv"></canvas><div class="ln"></div><div class="lt" data-i="signLine">Firma sobre la línea</div></div>
  <div class="mrow"><button type="button" class="btn danger sm" id="sigClear" data-i="clear">Borrar</button><span class="sp"></span>
    <button type="button" class="btn sm" id="sigCancel" data-i="cancel">Cancelar</button><button type="button" class="btn solid sm" id="sigSave" data-i="saveSig">Guardar firma</button></div>
</div></div>
<div class="modal" id="imgModal" hidden><div class="mbox"><img class="mimg" id="mImg" alt=""><div class="mrow"><strong id="mCap" style="margin-right:auto"></strong><button type="button" class="btn sm" id="mClose" data-i="close">Cerrar</button></div></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

function blank(){ return {v:3,step:0,tipo:null,servicio:"",fecha:today(),turno:"",ubicacion:"",inspector:"",piezas:[newPiece()],obs:"",sian:false,sianFolio:"",
  firmas:{inspector:blankSig(),supervisor:blankSig(),interesada:blankSig(),testigo:blankSig()},parte:blankParty()}; }
function migrate(d){ if(!d) return null; if(d.v===3) return d; if(d.v!==2) return null;
  const b=blank(); d.v=3; d.parte=b.parte; d.firmas={...b.firmas,...d.firmas}; Object.values(d.firmas).forEach(f=>{ if(!("ts" in f)) f.ts=null; }); return d; }
const fmtTs = ts => { if(!ts) return ""; const d=new Date(ts), z=n=>String(n).padStart(2,"0"); return `${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}`; };

/* ---------- Preferencias y borrador ---------- */
function pref(k,v){ try{ if(v===undefined) return localStorage.getItem("tmaz-r11-"+k); localStorage.setItem("tmaz-r11-"+k,v); }catch(e){ return null; } }
const DB = {
  db:null,
  async open(){ try{ this.db=await new Promise((res,rej)=>{ const r=indexedDB.open("tmaz-r11",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }catch(e){ this.db=null; } },
  async get(){ if(!this.db) return null; try{ return await new Promise((res,rej)=>{ const q=this.db.transaction("kv").objectStore("kv").get("draft"); q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } },
  put(v){ if(!this.db) return; try{ this.db.transaction("kv","readwrite").objectStore("kv").put(v,"draft"); }catch(e){} }
};

/* ---------- Estado de pasos ---------- */
function pieceState(p){ if(!p.marks.length) return "none"; return p.marks.includes("SD")?"ok":"dmg"; }
function counts(){ let d=0,o=0,f=0,wf=0; S.piezas.forEach(p=>{ const s=pieceState(p); if(s==="dmg")d++; if(s==="ok")o++; f+=p.fotos.length; if(p.fotos.length)wf++; }); return {t:S.piezas.length,d,o,f,wf}; }
function stepDone(i){
  if(i===0) return ["servicio","fecha","turno","ubicacion","inspector"].every(k=>String(S[k]||"").trim());
  if(i===1) return !!S.tipo;
  if(i===2) return !!S.tipo && S.piezas.length>0 && S.piezas.every(p=>p.id.trim() && p.marks.length);
  if(i===3) return !partyIssues().length && !!S.firmas.inspector.img;
  return false;
}
function partyIssues(){
  const e=L().err, P=S.parte, F=S.firmas, out=[];
  if(P.modo==="negativa"){ if(!F.testigo.nombre.trim()) out.push(e.tName); if(!F.testigo.img) out.push(e.tSig); return out; }
  if(!F.interesada.nombre.trim()) out.push(e.pName);
  if(!P.empresa.trim()) out.push(e.pEmp);
  if(!P.rep) out.push(e.pRep);
  if(!P.folioFoto) out.push(e.pFolioPh);
  if(!P.decl) out.push(e.pDecl);
  if(P.decl==="reservas" && !P.reservas.trim()) out.push(e.pRes);
  if(!F.interesada.img) out.push(e.pSig);
  return out;
}
function issues(){
  const e=L().err, out=[];
  [["servicio",0],["fecha",0],["turno",0],["ubicacion",0],["inspector",0]].forEach(([k,s])=>{ if(!String(S[k]||"").trim()) out.push([e[k],s]); });
  if(!S.tipo) out.push([e.tipo,1]);
  else S.piezas.forEach((p,i)=>{ if(!p.id.trim()) out.push([e.id(i+1),2]); if(!p.marks.length) out.push([e.mark(i+1),2]); });
  if(!S.firmas.inspector.img) out.push([e.sig,3]);
  partyIssues().forEach(m=>out.push([m,3]));
  return out;
}

  const dark = document.documentElement.dataset.theme==="dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  $("#themeBtn").textContent = dark ? L().light : L().dark;
}
function renderNav(){
  $("#nav").innerHTML = L().steps.map(([b,s],i)=>`<button type="button" data-go="${i}" class="${stepDone(i)?"done":""}" ${S.step===i?'aria-current="step"':""}>
    <span class="n">${stepDone(i)&&S.step!==i?"✓":i+1}</span><span><b>${b}</b><small>${s}</small></span></button>`).join("");
}
function navRow(){
  const st=L().steps, i=S.step;
  return `<div class="navrow">${i>0?`<button type="button" class="btn" data-go="${i-1}">${L().prev}</button>`:""}<span class="sp"></span>
    ${i<st.length-1?`<button type="button" class="btn solid" data-go="${i+1}">${L().next(st[i+1][0])}</button>`:""}</div>`;
}

  const l=L(), m=$("#main"); let h="";

const cv=$("#sigCv"), ctx=cv.getContext("2d"); let inked=false;
let strokeLen=0, bb=null;
function openSig(k){
  const l=L();
  if(k==="interesada" && !S.parte.decl){ toast(l.declFirst); return; }
  sigKey=k; $("#sigTitle").textContent=l.sigs[k]; $("#sigModal").hidden=false;
  const note=$("#sigNote");
  if(k==="interesada"){ const c=counts(); note.textContent=`${l.declTxt(c.t,c.d)} — ${S.parte.decl==="conforme"?l.conforme:l.reservas}${S.parte.decl==="reservas"&&S.parte.reservas?": "+S.parte.reservas:""}`; note.hidden=false; }
  else if(k==="testigo"){ note.textContent=l.refuseNote; note.hidden=false; } else note.hidden=true;
  strokeLen=0; bb=null;
  const r=cv.getBoundingClientRect(), dpr=Math.max(1,window.devicePixelRatio||1);
  cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#0b1f4d"; inked=false;
}
(function(){ let drawing=false,last=null; const pt=e=>{const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener("pointerdown",e=>{drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);e.preventDefault();});
  cv.addEventListener("pointermove",e=>{ if(!drawing) return; const p=pt(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke();
    strokeLen+=Math.hypot(p[0]-last[0],p[1]-last[1]); bb=bb?[Math.min(bb[0],p[0]),Math.min(bb[1],p[1]),Math.max(bb[2],p[0]),Math.max(bb[3],p[1])]:[p[0],p[1],p[0],p[1]];
    last=p; inked=true; });
  ["pointerup","pointercancel"].forEach(ev=>cv.addEventListener(ev,()=>drawing=false)); })();
function trimSig(){ // recorta el trazo para que la firma ocupe bien el recuadro del PDF
  const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y+=2) for(let x=0;x<w;x+=2){ if(d[(y*w+x)*4+3]>10){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1<=x0) return cv.toDataURL("image/png");
  const pad=12; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w,x1+pad); y1=Math.min(h,y1+pad);
  const o=document.createElement("canvas"); o.width=x1-x0; o.height=y1-y0; o.getContext("2d").drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height); return o.toDataURL("image/png");
}

function compress(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=()=>rej(fr.error);
  fr.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error("img")); im.onload=()=>{ const M=1280; let w=im.naturalWidth,h=im.naturalHeight; const s=Math.min(1,M/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
    const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h); res(c.toDataURL("image/jpeg",0.75)); }; im.src=fr.result; };
  fr.readAsDataURL(file); }); }

  if(b.id==="rmFolio"){ S.parte.folioFoto=null; render(); save(); return; }
  if(b.id==="pdfBtn"){ makePDF("download"); return; }
  if(b.id==="shareBtn"){ makePDF("share"); return; }
  if(b.id==="resetBtn"){ confirmReset=true; render(); return; }
  if(b.id==="rNo"){ confirmReset=false; render(); return; }
  if(b.id==="rYes"){ S=blank(); confirmReset=false; render(); save(); window.scrollTo({top:0}); toast(l.toastNew); return; }
});

/* ---------- PDF ---------- */
function imgSize(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r([i.naturalWidth,i.naturalHeight]); i.onerror=()=>r([4,3]); i.src=src; }); }
function fmtFecha(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
async function buildPDF(){
  const l=L(), { jsPDF } = window.jspdf;
  const doc=new jsPDF({orientation:"landscape",unit:"mm",format:"letter"});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=12, TOP=36;
  const t=TT(), codes=[...t.piece,...t.tarima];
  const GREEN=[0,75,47], RED=[196,32,47], INK=[27,42,34], MUT=[74,99,87], SOFT=[233,241,235];
  const turnoTxt=S.turno?l["t"+S.turno]:"";
  doc.autoTable({startY:TOP,margin:{left:M,right:M,top:TOP,bottom:16},theme:"grid",
    styles:{fontSize:8.5,cellPadding:1.8,lineColor:[170,185,176],lineWidth:.2,textColor:INK},
    columnStyles:{0:{fontStyle:"bold",fillColor:SOFT,cellWidth:36},2:{fontStyle:"bold",fillColor:SOFT,cellWidth:36},4:{fontStyle:"bold",fillColor:SOFT,cellWidth:24}},
    body:[[l.servicio,S.servicio,l.fecha,fmtFecha(S.fecha),l.turno,turnoTxt],[l.inspector,S.inspector,l.ubicacion,S.ubicacion,l.pdfMerc,t[LANG].label]]});
  let y=doc.lastAutoTable.finalY+4;
  doc.setFontSize(8); doc.setTextColor(...INK); doc.setFont("helvetica","bold"); doc.text(l.pdfInstr,M,y+3);
  doc.setFont("helvetica","normal"); const ins=doc.splitTextToSize(t[LANG].instr,W-2*M-28); doc.text(ins,M+28,y+3); y+=ins.length*3.6+2;
  doc.setFontSize(7.5); doc.setTextColor(...MUT);
  const leg=doc.splitTextToSize(["SD",...codes].map(c=>`${c} ${cn(c)}`).join("  |  "),W-2*M); doc.text(leg,M,y+3); y+=leg.length*3.4+3;
  const head=[[{content:l.pdfId,colSpan:2},{content:"SD",rowSpan:2},{content:t[LANG].grp,colSpan:t.piece.length},
      ...(t.tarima.length?[{content:l.pdfPal,colSpan:t.tarima.length}]:[]),{content:l.pdfPh,rowSpan:2},{content:l.pdfNote,rowSpan:2}],["#",l.pdfNum,...codes]];
  const body=S.piezas.map((p,i)=>[String(i+1),p.id,p.marks.includes("SD")?"X":"",...codes.map(c=>p.marks.includes(c)?"X":""),p.fotos.length?String(p.fotos.length):"",p.nota]);
  const cs={0:{cellWidth:8,halign:"center"},1:{cellWidth:46}}; for(let i=2;i<3+codes.length;i++) cs[i]={cellWidth:11,halign:"center",fontStyle:"bold"}; cs[3+codes.length]={cellWidth:14,halign:"center"};
  doc.autoTable({startY:y,margin:{left:M,right:M,top:TOP,bottom:16},theme:"grid",head,body,columnStyles:cs,
    styles:{fontSize:8.5,cellPadding:1.6,lineColor:[170,185,176],lineWidth:.2,textColor:INK,valign:"middle"},
    headStyles:{fillColor:GREEN,textColor:255,halign:"center",fontStyle:"bold",fontSize:8},
    didParseCell:d=>{ if(d.section!=="body") return; const p=S.piezas[d.row.index], ci=d.column.index;
      if(ci>=2&&ci<3+codes.length&&d.cell.raw==="X") d.cell.styles.textColor=ci===2?[21,128,61]:RED;
      if(p&&pieceState(p)==="dmg"&&ci===1) d.cell.styles.fillColor=[253,232,234]; }});
  y=doc.lastAutoTable.finalY+5;
  const obsLines=doc.splitTextToSize(S.obs||l.pdfNoObs,W-2*M-4);
  if(y+10+obsLines.length*3.8+8+42>H-16){ doc.addPage(); y=TOP; }
  doc.setFontSize(8.5); doc.setTextColor(...INK); doc.setFont("helvetica","bold"); doc.text(l.pdfObs,M,y); doc.setFont("helvetica","normal");
  doc.text(obsLines,M,y+4.5); y+=4.5+obsLines.length*3.8+2;
  const c=counts();
  doc.setFont("helvetica","bold"); doc.text(l.pdfSian,M,y+2); doc.setFont("helvetica","normal");
  doc.text(S.sian?`${l.pdfYes}${S.sianFolio?" — "+l.pdfFolio+" "+S.sianFolio:""}`:(c.d?l.pdfNotInd:l.pdfNA),M+30,y+2);
  doc.text(l.pdfSum(c.t,c.d,c.o,c.f),W/2,y+2); y+=8;
  // Parte interesada
  const PA=S.parte, FI=S.firmas.interesada, neg=PA.modo==="negativa";
  const idTxt=[l.idTypes[PA.idTipo]||"",PA.idNum].filter(Boolean).join(" ");
  const declRow = neg ? [l.pdfState,{content:`${l.partyRef.toUpperCase()}${PA.motivo?". "+l.refuseMotivo+": "+PA.motivo:""}`,colSpan:3}]
    : [l.pdfDecl,{content:`${l.declTxt(c.t,c.d)}  ${(PA.decl==="conforme"?l.conforme:l.reservas).toUpperCase()}${PA.decl==="reservas"?": "+PA.reservas:""}`,colSpan:3}];
  doc.autoTable({startY:y,margin:{left:M,right:M,top:TOP,bottom:16},theme:"grid",
    styles:{fontSize:8.2,cellPadding:1.6,lineColor:[170,185,176],lineWidth:.2,textColor:INK},
    headStyles:{fillColor:GREEN,textColor:255,fontStyle:"bold",fontSize:8},
    columnStyles:{0:{fontStyle:"bold",fillColor:SOFT,cellWidth:38},2:{fontStyle:"bold",fillColor:SOFT,cellWidth:38}},
    head:[[{content:l.pTitleI.toUpperCase(),colSpan:4}]],
    body:[[l.pFull,FI.nombre,l.pEmp,PA.empresa],[l.pRep,l.reps[PA.rep]||"",l.pCargo,PA.cargo],[l.pIdT,idTxt,l.pFolio,PA.folio],declRow],
    didParseCell:d=>{ if(d.section==="body"&&d.row.index===3&&d.column.index===1&&!neg&&PA.decl==="reservas") d.cell.styles.textColor=RED; }});
  y=doc.lastAutoTable.finalY+4;
  const bw=(W-2*M-16)/3, bh=42;
  if(y+bh+6>H-16){ doc.addPage(); y=TOP; }
  const third=neg?"testigo":"interesada";
  const thirdLbl=neg?`${l.sigs.testigo} (${l.partyRef.toLowerCase()})`:l.sigs.interesada;
  const boxes=[["inspector",l.sigs.inspector],["supervisor",l.sigs.supervisor],[third,thirdLbl]];
  for(let i=0;i<3;i++){ const [k,lbl]=boxes[i], x=M+i*(bw+8), f=S.firmas[k];
    doc.setDrawColor(170,185,176); doc.setLineWidth(.2); doc.rect(x,y,bw,bh);
    if(f.img){ const [iw,ih]=await imgSize(f.img); const mw=bw-10, mh=bh-21, s=Math.min(mw/iw,mh/ih); doc.addImage(f.img,"PNG",x+(bw-iw*s)/2,y+2+(mh-ih*s)/2,iw*s,ih*s); }
    doc.setDrawColor(...INK); doc.line(x+6,y+bh-17,x+bw-6,y+bh-17);
    doc.setFontSize(8.5); doc.setTextColor(...INK); doc.text(f.nombre||"",x+bw/2,y+bh-12.5,{align:"center"});
    doc.setFontSize(7.2); doc.setTextColor(...MUT); doc.text(f.ts?`${l.signedAt}: ${fmtTs(f.ts)}`:"",x+bw/2,y+bh-8,{align:"center"});
    doc.text(doc.splitTextToSize(`${l.pdfSign} — ${lbl}`,bw-4)[0],x+bw/2,y+bh-3.5,{align:"center"}); }
  doc.setFontSize(7); doc.setTextColor(...MUT); doc.text(l.privacy,M,y+bh+4);
  const shots=[]; if(PA.folioFoto) shots.push({folio:true,f:PA.folioFoto});
  S.piezas.forEach((p,i)=>p.fotos.forEach((f,j)=>shots.push({p,i,j,f})));
  if(shots.length){ const cols=3,rows=2,gx=6,cw=(W-2*M-(cols-1)*gx)/cols,ch=(H-TOP-16-10-(rows-1)*6)/rows,capH=9;
    for(let s=0;s<shots.length;s++){ const slot=s%(cols*rows);
      if(slot===0){ doc.addPage(); doc.setFontSize(10); doc.setFont("helvetica","bold"); doc.setTextColor(...GREEN); doc.text(l.pdfAnnex,M,TOP+2); doc.setFont("helvetica","normal"); }
      const {p,i,j,f}=shots[s], cx=M+(slot%cols)*(cw+gx), cy=TOP+8+Math.floor(slot/cols)*(ch+6);
      const [iw,ih]=await imgSize(f), bhI=ch-capH, sc=Math.min(cw/iw,bhI/ih), w=iw*sc, h=ih*sc;
      doc.setFillColor(240,243,241); doc.rect(cx,cy,cw,bhI,"F"); doc.addImage(f,"JPEG",cx+(cw-w)/2,cy+(bhI-h)/2,w,h,undefined,"MEDIUM");
      doc.setFontSize(8); doc.setTextColor(...INK);
      const cap = shots[s].folio ? `${l.pFolio} — ${l.sigs.interesada}${PA.folio?": "+PA.folio:""}`
        : (()=>{ const dm=p.marks.filter(m=>m!=="SD"); return `#${i+1} · ${p.id||l.pdfNoIdShort} · ${l.pdfPhoto} ${j+1} · ${dm.length?dm.map(m=>m+" "+cn(m)).join(", "):cn("SD")}`; })();
      doc.text(doc.splitTextToSize(cap,cw),cx,cy+bhI+4); } }
  const n=doc.getNumberOfPages();
  for(let pg=1;pg<=n;pg++){ doc.setPage(pg);
    const hx=M,hy=8,hw=W-2*M,hh=24,lw=40,rw=58;
    doc.setDrawColor(...INK); doc.setLineWidth(.3); doc.rect(hx,hy,hw,hh); doc.line(hx+lw,hy,hx+lw,hy+hh); doc.line(hx+hw-rw,hy,hx+hw-rw,hy+hh);
    doc.addImage(IMG.logo,"PNG",hx+3,hy+3,34,18);
    doc.setTextColor(...INK); doc.setFontSize(7.5); doc.setFont("helvetica","normal"); doc.text(l.pdfDocType,hx+lw+3,hy+4.5);
    doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text(l.pdfT,hx+lw+(hw-lw-rw)/2,hy+13,{align:"center"});
    doc.setFontSize(9); doc.text(DOC.codigo,hx+lw+(hw-lw-rw)/2,hy+19,{align:"center"});
    doc.setFont("helvetica","normal"); doc.setFontSize(8); const rx=hx+hw-rw+3;
    doc.text(l.pdfArea,rx,hy+6); doc.text(`${l.pdfDate}: ${DOC.fecha}`,rx,hy+12); doc.text(`${l.pdfVer}: ${DOC.version}`,rx,hy+18); doc.text(l.pdfPage(pg,n),rx+28,hy+18);
    doc.setFillColor(238,45,66); doc.rect(hx,hy+hh,hw,.8,"F");
    doc.setFontSize(7); doc.setTextColor(...MUT); doc.text(l.pdfFoot,W/2,H-7,{align:"center"}); }
  return doc;
}
function fileName(){ const s=(S.servicio||"servicio").replace(/[^\w\-]+/g,"_").slice(0,40); return `R-11_${S.tipo}_${s}_${S.fecha||today()}.pdf`; }
function canShare(){ try{ return !window.claude && !!navigator.canShare && navigator.canShare({files:[new File(["x"],"a.pdf",{type:"application/pdf"})]}); }catch(e){ return false; } }
async function makePDF(mode){
  const l=L(); if(issues().length) return;
  if(!window.jspdf){ toast(l.toastLib); return; }
  const btn=mode==="share"?$("#shareBtn"):$("#pdfBtn"), old=btn.textContent; btn.disabled=true; btn.textContent=l.generating;
  try{
    const doc=await buildPDF(), blob=doc.output("blob"), name=fileName();
    if(mode==="share"){ try{ await navigator.share({files:[new File([blob],name,{type:"application/pdf"})],title:name}); }catch(e){ if(e.name!=="AbortError") toast(l.toastNoSave); } return; }
    if(window.claude && typeof window.claude.use==="function"){ const dl=await window.claude.use("downloads");
      if(dl){ try{ await dl.save({filename:name,data:blob}); toast(l.toastSaved); }catch(e){ toast(e&&e.code==="declined"?l.toastDecl:l.toastNoSave); } return; } }
    const url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast(l.toastPdf);
  }catch(e){ console.error(e); toast("Error: "+(e.message||e)); }
  finally{ btn.disabled=false; btn.textContent=old; }
}
